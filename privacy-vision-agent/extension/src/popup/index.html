<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha X1 Privacy Browser Agent</title>
  <style>
    :root {
      --bg: #000000;
      --glass: rgba(255, 255, 255, 0.055);
      --glass-hover: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f5f6fb;
      --text-dim: rgba(235, 237, 245, 0.62);
      --ok: #34d399;
      --ok-bg: rgba(52, 211, 153, 0.16);
      --bad: #fb7185;
      --bad-bg: rgba(251, 113, 133, 0.16);
      --accent: #6366f1;
      --accent-2: #818cf8;
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.22), transparent 45%),
        radial-gradient(circle at 100% 30%, rgba(129, 140, 248, 0.1), transparent 40%),
        var(--bg);
      color: var(--text);
      padding: 18px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .container { display: flex; flex-direction: column; gap: 14px; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 4px; }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon {
      width: 30px; height: 30px; border-radius: 9px;
      background: #000;
      border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header h1 { font-size: 12.5px; font-weight: 700; letter-spacing: 0.1px; line-height: 1.3; }
    .brand-icon img { width: 100%; height: 100%; object-fit: cover; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px var(--ok-bg);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: fadeIn 0.22s ease-out;
    }

    .card h2 {
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card h2 svg { opacity: 0.85; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row:first-child { padding-top: 0; }

    .info-row label {
      opacity: 0.75;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-row value {
      font-weight: 600;
      text-align: right;
      flex: 1;
      margin-left: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .url-display {
      font-size: 10.5px;
      opacity: 0.6;
      word-break: break-all;
      margin-top: 6px;
      line-height: 1.5;
    }

    .buttons { display: flex; gap: 9px; flex-direction: column; }

    button {
      padding: 11px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: transform 90ms ease, background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:active:not(:disabled) { transform: scale(0.985); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: rgba(255, 255, 255, 0.94);
      color: #4338ca;
      box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.35);
    }
    .btn-primary:hover:not(:disabled) { background: #ffffff; transform: translateY(-1px); }

    .btn-ghost {
      background: var(--glass);
      color: var(--text);
      border-color: var(--glass-border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--glass-hover); }

    .btn-danger {
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .btn-danger:hover:not(:disabled) { background: var(--bad-bg); color: #fff; border-color: transparent; }

    .loading {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .error, .success {
      font-size: 11.5px;
      margin-top: -2px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      display: none;
      align-items: center;
      gap: 7px;
      animation: fadeIn 0.18s ease-out;
    }
    .error.show, .success.show { display: flex; }
    .error { color: #ffe4e6; background: var(--bad-bg); border: 1px solid rgba(251, 113, 133, 0.3); }
    .success { color: #d1fae5; background: var(--ok-bg); border: 1px solid rgba(52, 211, 153, 0.3); }

    .screenshot-box {
      margin-top: 10px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }
    .screenshot-box img {
      width: 100%;
      display: block;
      max-height: 280px;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <span class="brand-icon">
          <img src="icons/icon48.png" alt="AX1 logo" />
        </span>
        <h1>Alpha X1 Privacy Browser Agent</h1>
      </div>
      <div class="status ready" id="status">
        <span class="status-dot"></span>Ready
      </div>
    </div>

    <div class="card">
      <h2>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Current Page
      </h2>
      <div class="info-row">
        <label>Title</label>
        <value id="pageTitle">—</value>
      </div>
      <div class="url-display" id="pageUrl"></div>
    </div>

    <div class="card">
      <h2>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
        DOM Analysis
      </h2>
      <div class="info-row">
        <label>Buttons</label>
        <value id="buttonCount">—</value>
      </div>
      <div class="info-row">
        <label>Inputs</label>
        <value id="inputCount">—</value>
      </div>
      <div class="info-row">
        <label>Links</label>
        <value id="linkCount">—</value>
      </div>
      <div class="info-row">
        <label>Other Elements</label>
        <value id="otherCount">—</value>
      </div>
      <div class="info-row">
        <label>Last Scanned</label>
        <value id="lastScan">Never</value>
      </div>
    </div>

    <div class="card">
      <h2>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        Screenshot
      </h2>
      <div class="info-row">
        <label>Status</label>
        <value id="screenshotStatus">Not captured</value>
      </div>
      <div id="screenshotPreview" class="screenshot-box" style="display: none;">
        <img id="screenshotImg" alt="Captured screenshot preview" />
      </div>
    </div>

    <div class="card">
      <h2>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
        Backend Connection
      </h2>
      <div class="info-row">
        <label>Status</label>
        <value id="backendStatus">Connecting...</value>
      </div>
      <div class="info-row">
        <label>Session ID</label>
        <value id="sessionId">—</value>
      </div>
    </div>

    <div class="card">
      <h2>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
        Local Processing
      </h2>
      <div class="info-row">
        <label>Status</label>
        <value style="color: var(--ok);">Active (on-device only)</value>
      </div>
    </div>

    <div class="buttons">
      <button class="btn-primary" id="openPanelBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
        Open Privacy Inspection Panel
      </button>
      <button class="btn-ghost" id="scanBtn">Scan DOM</button>
      <button class="btn-ghost" id="screenshotBtn">Capture Screenshot</button>
      <button class="btn-ghost" id="reasonBtn">Ask Agent</button>
      <button class="btn-danger" id="resetBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
    </div>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
