name: CI

on:
  push:
    branches: [main, feature/vllm]
  pull_request:
    branches: [main, feature/vllm]

jobs:
  extension:
    name: Extension (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: privacy-vision-agent/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: privacy-vision-agent/extension/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: privacy-vision-agent/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            privacy-vision-agent/backend/requirements.txt
            privacy-vision-agent/backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v
